      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/branch'
      - $ref: '#/components/parameters/include_annotations'
      - $ref: '#/components/parameters/omit_translation_keys'
      responses:
        '200':
          description: OK
          content:
