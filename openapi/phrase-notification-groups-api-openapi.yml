openapi: 3.0.3
info:
  title: Phrase Strings API Reference Accounts Notification Groups API
  version: 2.0.0
  description: Phrase Strings is a translation management platform for software projects. You can collaborate on language file translation with your team or order translations through our platform. The API allows you to import locale files, download locale files, tag keys or interact in other ways with the localization data stored in Phrase Strings for your account.
  contact:
    name: Phrase Support
    url: https://developers.phrase.com/api/
    email: support@phrase.com
  x-logo:
    url: https://developers.phrase.com/images/phrase-logo.svg
    backgroundColor: '#03eab3'
    altText: Phrase Strings
  termsOfService: https://phrase.com/terms/
  license:
    name: MIT
    url: https://choosealicense.com/licenses/mit/
servers:
- url: https://api.phrase.com/v2
  description: EU production server
- url: https://api.us.app.phrase.com/v2
  description: US production server
security:
- Token: []
- Basic: []
tags:
- name: Notification Groups
paths:
  /notification_groups:
    get:
      summary: List notification groups
      description: List all notification groups from the current user
      operationId: notification_groups/list
      tags:
      - Notification Groups
      parameters:
      - $ref: '#/components/parameters/X-PhraseApp-OTP'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/notification_group_detail'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/X-Rate-Limit-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
            Link:
              $ref: '#/components/headers/Link'
            Pagination:
              $ref: '#/components/headers/Pagination'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      x-code-samples:
      - lang: Curl
        source: "curl \"https://api.phrase.com/v2/notification_groups\" \\\n  -u USERNAME_OR_ACCESS_TOKEN"
      - lang: CLI v2
        source: 'phrase notification_groups list \

          --access_token <token>'
      x-cli-version: '2.5'
  /notification_groups/mark_all_as_read:
    patch:
      summary: Mark all notification groups as read
      description: Mark all notification groups of the current user as read
      operationId: notification_groups/mark_all_as_read
      tags:
      - Notification Groups
      parameters:
      - $ref: '#/components/parameters/X-PhraseApp-OTP'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/notification_group_detail'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/X-Rate-Limit-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      x-code-samples:
      - lang: Curl
        source: "curl \"https://api.phrase.com/v2/notification_groups/mark_all_as_read\" \\\n  -u USERNAME_OR_ACCESS_TOKEN \\\n  -X PATCH \\\n  -H 'Content-Type: application/json'"
      - lang: CLI v2
        source: 'phrase notification_groups mark_all_as_read \

          --access_token <token>'
      x-cli-version: '2.5'
  /notification_groups/{id}/mark_as_read:
    patch:
      summary: Mark a notification group as read
      description: Mark a notifications group of the current user as read
      operationId: notification_groups/mark_as_read
      tags:
      - Notification Groups
      parameters:
      - $ref: '#/components/parameters/X-PhraseApp-OTP'
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notification_group_detail'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/X-Rate-Limit-Limit'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/X-Rate-Limit-Remaining'
            X-Rate-Limit-Reset:
              $ref: '#/components/headers/X-Rate-Limit-Reset'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      x-code-samples:
      - lang: Curl
        source: "curl \"https://api.phrase.com/v2/notification_groups/:id/mark_as_read\" \\\n  -u USERNAME_OR_ACCESS_TOKEN \\\n  -X PATCH \\\n  -H 'Content-Type: application/json'"
      - lang: CLI v2
        source: 'phrase notification_groups mark_as_read \

          --id <id> \

          --access_token <token>'
      x-cli-version: '2.5'
components:
  schemas:
    notification:
      type: object
      title: notification
      properties:
        id:
          type: string
        event_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        seen_at:
          type: string
          format: date-time
        data:
          type: object
        resource:
          type: object
        locale:
          $ref: '#/components/schemas/locale'
        user:
          $ref: '#/components/schemas/user_preview'
        project:
          $ref: '#/components/schemas/project'
        account:
          $ref: '#/components/schemas/account'
        group:
          $ref: '#/components/schemas/notification_group'
      example:
        id: abcd1234
        event_name: keys:create
        data: object notification data
        resource: object of notification resource
        locale:
          id: abcd1234cdef1234abcd1234cdef1234
          name: de
          code: de-DE
          default: true
          main: false
          rtl: false
          plural_forms:
          - zero
          - one
          - other
          source_locale:
            id: abcd1234cdef1234abcd1234cdef1234
            name: en
            code: en-GB
          created_at: '2015-01-28T09:52:53Z'
          updated_at: '2015-01-28T09:52:53Z'
        user:
          id: abcd1234cdef1234abcd1234cdef1234
          username: joe.doe
          name: Joe Doe
        project:
          id: abcd1234cdef1234abcd1234cdef1234
          name: My Android Project
          main_format: xml
          project_image_url: http://assets.example.com/project.png
          account:
            id: abcd1234
            name: Company Account
            slug: company_account
            company: My Awesome Company
            created_at: '2015-01-28T09:52:53Z'
            updated_at: '2015-01-28T09:52:53Z'
            company_logo_url: http://assets.example.com/company_logo.png
          created_at: '2015-01-28T09:52:53Z'
          updated_at: '2015-01-28T09:52:53Z'
        account:
          id: abcd1234
          name: Company Account
          slug: company_account
          company: My Awesome Company
          created_at: '2015-01-28T09:52:53Z'
          updated_at: '2015-01-28T09:52:53Z'
