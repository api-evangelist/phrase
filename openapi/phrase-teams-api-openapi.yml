      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: teams/spaces/create/parameters
              required:
              - id
              properties:
                id:
                  description: Space ID to add to the Team
                  type: string
                  example: a4b3c2d1
      x-cli-version: '2.5'
  /accounts/{account_id}/teams/{team_id}/spaces/{id}:
    delete:
      summary: Remove Space
      description: Removes a specified space from the specified team.
      operationId: teams/spaces/delete
      tags:
      - Teams
      parameters:
      - $ref: '#/components/parameters/X-PhraseApp-OTP'
      - $ref: '#/components/parameters/account_id'
      - $ref: '#/components/parameters/team_id'
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '429':
