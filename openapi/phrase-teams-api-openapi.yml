      x-code-samples:
      - lang: Curl
        source: "curl \"https://api.phrase.com/v2/accounts/:account_id/teams/:team_id/spaces/:id\" \\\n  -u USERNAME_OR_ACCESS_TOKEN \\\n  -X DELETE"
      - lang: CLI v2
        source: 'phrase teams spaces_delete \

          --account_id <account_id> \

          --team_id <team_id> \

          --id <id> \

          --access_token <token>'
      x-cli-version: '2.5'
  /accounts/{account_id}/teams/{team_id}/users:
    post:
      summary: Add User
      description: Adds an existing user to the team.
      operationId: teams/users/create
      tags:
      - Teams
      parameters:
      - $ref: '#/components/parameters/X-PhraseApp-OTP'
      - $ref: '#/components/parameters/account_id'
      - $ref: '#/components/parameters/team_id'
      responses:
        '201':
          description: Created
          headers:
            X-Rate-Limit-Limit:
